<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TecGame</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<body>
<div class="wrap">
  <div id="menu" class="menu">
    <h2>TEC SPEED</h2>
    <input type="text" id="playerName" placeholder="Digite seu nome" />
    <br>
    <button id="menuStart">Iniciar</button>
    <button id="menuRanking">Ranking</button>
  </div>

  <div id="ranking" class="ranking hidden">
    <h2>Ranking</h2>
    <ol id="rankingList"></ol>
    <button onclick="showMenu()">Voltar</button>
  </div>

  <div id="gameArea" class="hidden">
    <div id="gameOverOverlay" class="overlay hidden"></div>
    <header>
      <h1>PLAY</h1>
      <div class="hud">
        <button id="pauseBtn">Pausar</button>
        <div class="stats">
          <div class="stat">Placar: <span id="score">0</span></div>
          <div class="stat">Combo: <span id="combo">0</span></div>
          <div class="stat">Vidas: <span id="lives">3</span></div>
          <div class="stat">Acurácia: <span id="acc">100%</span></div>
        </div>
      </div>
    </header>
    <canvas id="gameCanvas" width="800" height="520"></canvas>
    <div class="touch-row" id="touchRow">
      <div class="touch-btn" data-col="0">D</div>
      <div class="touch-btn" data-col="1">F</div>
      <div class="touch-btn" data-col="2">J</div>
      <div class="touch-btn" data-col="3">K</div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
